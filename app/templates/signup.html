{% extends 'base.html' %}{% block content %}<section class="auth"><h1>Create your learner account</h1>{% if request.query_params.get('error') %}<p class="error">{{ request.query_params.get('error') }}</p>{% endif %}<form method="post"><label>Name<input name="name" required maxlength="100"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><label>Learning path<select name="path_id">{% for path in paths %}<option value="{{path.id}}">{{path.title}}</option>{% endfor %}</select></label><button class="button">Create account</button></form><p>Already registered? <a href="/login">Sign in</a>.</p></section>{% endblock %}
